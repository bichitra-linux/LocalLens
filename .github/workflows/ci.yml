name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LocalLens/package-lock.json
      - run: npm ci
        working-directory: LocalLens
      - run: npx tsc --noEmit
        working-directory: LocalLens
      - run: npx expo-doctor
        working-directory: LocalLens
